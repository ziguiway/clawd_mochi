<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020">
  <rect width="1440" height="1020" fill="#101114"/>
  <text x="72" y="78" fill="#ffffff" font-family="Hiragino Sans GB, sans-serif" font-size="42" font-weight="700">Surprise A · 嘴型细化</text>
  <text x="72" y="122" fill="#92949b" font-family="Hiragino Sans GB, sans-serif" font-size="22">竖长实心眼保持一致，只比较嘴巴的情绪强度与真机辨识度</text>

  <!-- A1 -->
  <g transform="translate(112 186)">
    <rect x="-9" y="-9" width="538" height="538" rx="58" fill="none" stroke="#FF8A22" stroke-width="5"/>
    <rect width="520" height="520" rx="48" fill="#FA6A00"/>
    <g transform="scale(2.1666667)">
      <rect x="30" y="48" width="44" height="66" rx="22" fill="#101114"/>
      <rect x="166" y="48" width="44" height="66" rx="22" fill="#101114"/>

      <!-- compact rounded O mouth -->
      <ellipse cx="120" cy="151" rx="18" ry="22" fill="#101114"/>
      <ellipse cx="120" cy="151" rx="9" ry="12" fill="#FA6A00"/>
    </g>
    <rect x="364" y="20" width="132" height="42" rx="21" fill="#101114"/>
    <text x="430" y="49" text-anchor="middle" fill="#FF8A22" font-family="Hiragino Sans GB, sans-serif" font-size="19" font-weight="700">推荐</text>
    <text x="0" y="572" fill="#ffffff" font-family="Hiragino Sans GB, sans-serif" font-size="30" font-weight="700">A1 · 圆润小 O 嘴</text>
    <text x="0" y="610" fill="#d2d3d6" font-family="Hiragino Sans GB, sans-serif" font-size="20">短而圆，像突然倒吸一口气</text>
    <text x="0" y="642" fill="#92949b" font-family="Hiragino Sans GB, sans-serif" font-size="18">情绪清楚，但不会抢过眼睛</text>
  </g>

  <!-- A2 -->
  <g transform="translate(808 186)">
    <rect width="520" height="520" rx="48" fill="#FA6A00"/>
    <g transform="scale(2.1666667)">
      <rect x="30" y="48" width="44" height="66" rx="22" fill="#101114"/>
      <rect x="166" y="48" width="44" height="66" rx="22" fill="#101114"/>

      <!-- heavier lower lip / dropped jaw mouth -->
      <rect x="102" y="127" width="36" height="55" rx="18" fill="#101114"/>
      <rect x="111" y="136" width="18" height="28" rx="9" fill="#FA6A00"/>
      <path d="M111 165 Q120 173 129 165 L129 170 Q120 178 111 170 Z" fill="#FA6A00"/>
    </g>
    <text x="0" y="572" fill="#ffffff" font-family="Hiragino Sans GB, sans-serif" font-size="30" font-weight="700">A2 · 惊掉下巴</text>
    <text x="0" y="610" fill="#d2d3d6" font-family="Hiragino Sans GB, sans-serif" font-size="20">嘴巴更长，下方轮廓更厚重</text>
    <text x="0" y="642" fill="#92949b" font-family="Hiragino Sans GB, sans-serif" font-size="18">惊讶更强烈，带一点呆萌感</text>
  </g>

  <g transform="translate(112 892)">
    <rect width="1216" height="80" rx="24" fill="#191b20"/>
    <text x="32" y="50" fill="#c9cace" font-family="Hiragino Sans GB, sans-serif" font-size="20">
      两版均可直接用 fillRoundRect / fillCircle 实现；A1 更适合常驻表情，A2 更适合强调“震惊”。
    </text>
  </g>
</svg>
