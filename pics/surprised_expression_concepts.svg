<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120">
  <rect width="1440" height="1120" fill="#101114"/>
  <text x="72" y="82" fill="#ffffff" font-family="Hiragino Sans GB, sans-serif" font-size="42" font-weight="700">Clawd Mochi · Surprise 表情提案</text>
  <text x="72" y="126" fill="#9b9da3" font-family="Hiragino Sans GB, sans-serif" font-size="22">按 240 × 240 屏幕比例绘制 · 橙色背景 + 黑色基础图元</text>

  <!-- Current -->
  <g transform="translate(72 190)">
    <rect width="288" height="288" rx="26" fill="#FA6A00"/>
    <g transform="scale(1.2)">
      <circle cx="45" cy="80" r="24" fill="#101114"/>
      <circle cx="45" cy="80" r="11" fill="#FA6A00"/>
      <circle cx="195" cy="80" r="24" fill="#101114"/>
      <circle cx="195" cy="80" r="11" fill="#FA6A00"/>
    </g>
    <text x="0" y="338" fill="#ffffff" font-family="Hiragino Sans GB, sans-serif" font-size="28" font-weight="700">当前版本</text>
    <text x="0" y="374" fill="#909299" font-family="Hiragino Sans GB, sans-serif" font-size="18">双圆环像护目镜</text>
    <text x="0" y="404" fill="#909299" font-family="Hiragino Sans GB, sans-serif" font-size="18">缺少嘴巴，情绪不完整</text>
  </g>

  <!-- A -->
  <g transform="translate(408 190)">
    <rect x="-8" y="-8" width="304" height="304" rx="34" fill="none" stroke="#FF9A46" stroke-width="4"/>
    <rect width="288" height="288" rx="26" fill="#FA6A00"/>
    <g transform="scale(1.2)">
      <rect x="30" y="48" width="44" height="66" rx="22" fill="#101114"/>
      <rect x="166" y="48" width="44" height="66" rx="22" fill="#101114"/>
      <ellipse cx="120" cy="151" rx="18" ry="24" fill="#101114"/>
      <ellipse cx="120" cy="151" rx="9" ry="14" fill="#FA6A00"/>
    </g>
    <rect x="170" y="18" width="101" height="38" rx="19" fill="#101114"/>
    <text x="220.5" y="44" text-anchor="middle" fill="#FF9A46" font-family="Hiragino Sans GB, sans-serif" font-size="18" font-weight="700">推荐</text>
    <text x="0" y="338" fill="#ffffff" font-family="Hiragino Sans GB, sans-serif" font-size="28" font-weight="700">A · 经典震惊脸</text>
    <text x="0" y="374" fill="#d2d3d6" font-family="Hiragino Sans GB, sans-serif" font-size="18">竖长眼 + 小 O 嘴</text>
    <text x="0" y="404" fill="#d2d3d6" font-family="Hiragino Sans GB, sans-serif" font-size="18">最清楚、最耐看</text>
  </g>

  <!-- B -->
  <g transform="translate(744 190)">
    <rect width="288" height="288" rx="26" fill="#FA6A00"/>
    <g transform="scale(1.2)">
      <circle cx="51" cy="82" r="29" fill="#101114"/>
      <circle cx="188" cy="84" r="20" fill="#101114"/>
      <ellipse cx="121" cy="151" rx="17" ry="23" fill="#101114"/>
      <ellipse cx="121" cy="151" rx="8" ry="13" fill="#FA6A00"/>
      <rect x="25" y="36" width="45" height="7" rx="3.5" fill="#101114" transform="rotate(-8 25 36)"/>
      <rect x="169" y="42" width="38" height="7" rx="3.5" fill="#101114" transform="rotate(8 169 42)"/>
    </g>
    <text x="0" y="338" fill="#ffffff" font-family="Hiragino Sans GB, sans-serif" font-size="28" font-weight="700">B · 猝不及防</text>
    <text x="0" y="374" fill="#909299" font-family="Hiragino Sans GB, sans-serif" font-size="18">大小眼 + 抬起眉毛</text>
    <text x="0" y="404" fill="#909299" font-family="Hiragino Sans GB, sans-serif" font-size="18">更夸张、更有喜剧感</text>
  </g>

  <!-- C -->
  <g transform="translate(1080 190)">
    <rect width="288" height="288" rx="26" fill="#FA6A00"/>
    <g transform="scale(1.2)">
      <circle cx="50" cy="77" r="13" fill="#101114"/>
      <circle cx="190" cy="77" r="13" fill="#101114"/>
      <ellipse cx="120" cy="148" rx="27" ry="35" fill="#101114"/>
      <ellipse cx="120" cy="146" rx="14" ry="21" fill="#FA6A00"/>
      <rect x="27" y="42" width="46" height="6" rx="3" fill="#101114" transform="rotate(-10 27 42)"/>
      <rect x="167" y="35" width="46" height="6" rx="3" fill="#101114" transform="rotate(10 167 35)"/>
    </g>
    <text x="0" y="338" fill="#ffffff" font-family="Hiragino Sans GB, sans-serif" font-size="28" font-weight="700">C · 目瞪口呆</text>
    <text x="0" y="374" fill="#909299" font-family="Hiragino Sans GB, sans-serif" font-size="18">小瞳孔 + 大 O 嘴</text>
    <text x="0" y="404" fill="#909299" font-family="Hiragino Sans GB, sans-serif" font-size="18">嘴巴成为主要视觉焦点</text>
  </g>

  <g transform="translate(72 676)">
    <rect width="1296" height="328" rx="30" fill="#191b20"/>
    <text x="42" y="60" fill="#FF8A22" font-family="Hiragino Sans GB, sans-serif" font-size="26" font-weight="700">我的建议：选择 A「经典震惊脸」</text>
    <text x="42" y="112" fill="#d8d9dc" font-family="Hiragino Sans GB, sans-serif" font-size="22">竖长实心眼延续 Clawd Mochi 日常眼睛的造型，只通过放大、变圆和增加 O 形嘴表达惊讶。</text>
    <text x="42" y="154" fill="#d8d9dc" font-family="Hiragino Sans GB, sans-serif" font-size="22">相比圆环眼，它不会像护目镜；相比大小眼版本，也更适合作为长期使用的默认 Surprise。</text>
    <line x1="42" y1="192" x2="1254" y2="192" stroke="#303238"/>
    <text x="42" y="238" fill="#92949b" font-family="Hiragino Sans GB, sans-serif" font-size="19">建议动画：进入表情时，眼睛和嘴巴从 85% 快速弹到 110%，再回落到 100%，总时长约 260 ms。</text>
    <text x="42" y="278" fill="#92949b" font-family="Hiragino Sans GB, sans-serif" font-size="19">静态版本也能清晰识别；动画可在确认造型后再决定是否加入。</text>
  </g>
</svg>
