; PlatformIO Project Configuration File
;
; Clawd Mochi - Claude Code 实时状态显示伴侣
; ESP32-C3 Super Mini + ST7789 1.54" 240x240 TFT

[env:esp32-c3-devkitc-02]
platform = espressif32
board = esp32-c3-devkitc-02
framework = arduino

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; 启用 LittleFS
board_build.filesystem = littlefs
; 游戏模块需要更大的应用分区。保留 NVS 与约 896KB LittleFS，
; 将原来的双 OTA 1.25MB 插槽改为单个 3MB 应用分区。
board_build.partitions = ota_4mb.csv

; 库依赖
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ST7735 and ST7789 Library
    olikraus/U8g2_for_Adafruit_GFX@^1.8.0
    bblanchon/ArduinoJson
    qrcode
    bitbank2/AnimatedGIF@^2.2.3
    bodmer/TJpg_Decoder@^1.1.0

; 上传速度
upload_speed = 921600

; 监视速度
monitor_speed = 115200
