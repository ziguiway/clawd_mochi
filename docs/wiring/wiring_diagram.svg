<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" font-family="Helvetica Neue, PingFang SC, Arial, sans-serif">
  <defs>
    <linearGradient id="scr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb6b10"/>
      <stop offset="1" stop-color="#d94f06"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1600" height="1120" fill="#f6f7f9"/>

  <!-- Title -->
  <text x="800" y="70" text-anchor="middle" font-size="44" font-weight="800" fill="#1a1a1a">Clawd Mochi 接线图</text>
  <text x="800" y="112" text-anchor="middle" font-size="22" fill="#666">ESP32-C3 Super Mini → 1.54" ST7789 TFT（240×240）· 共 8 根线 · 无需焊接额外元件</text>

  <!-- ================= WIRES (drawn under boards' edge, over bg) ================= -->
  <!-- GND black: board left pad G (380,270) -> screen GND (1090,672) -->
  <path d="M382 270 H220 V672 H1088" fill="none" stroke="#1a1a1a" stroke-width="7" stroke-linecap="round"/>
  <!-- VCC red: board 3V3 (382,320) -> VCC (1130,672) -->
  <path d="M382 320 H260 V700 H1128 V674" fill="none" stroke="#e53935" stroke-width="7" stroke-linecap="round"/>
  <!-- SCL yellow: board GPIO8 (382,420) -> SCL pin (1170,672) -->
  <path d="M382 420 H300 V740 H1168 V674" fill="none" stroke="#f9a825" stroke-width="7" stroke-linecap="round"/>
  <!-- SDA green: board GPIO10 (382,370) -> SDA (1210,672) -->
  <path d="M382 370 H340 V780 H1208 V674" fill="none" stroke="#43a047" stroke-width="7" stroke-linecap="round"/>
  <!-- CS blue: board GPIO4 (578,370) -> CS (1370,672) -->
  <path d="M578 370 H640 V780 H1368 V674" fill="none" stroke="#1e88e5" stroke-width="7" stroke-linecap="round"/>
  <!-- BL purple: board GPIO3 (578,420) -> BLK (1330,672) -->
  <path d="M578 420 H680 V740 H1328 V674" fill="none" stroke="#8e24aa" stroke-width="7" stroke-linecap="round"/>
  <!-- RST orange: board GPIO2 (578,470) -> RES (1250,672) -->
  <path d="M578 470 H720 V700 H1248 V674" fill="none" stroke="#fb8c00" stroke-width="7" stroke-linecap="round"/>
  <!-- DC pink/gray: board GPIO1 (578,520) -> DC (1290,672) -->
  <path d="M578 520 H760 V730 H1288 V674" fill="none" stroke="#d81b60" stroke-width="7" stroke-linecap="round"/>

  <!-- wire labels -->
  <g font-size="17" font-weight="700" fill="#fff">
    <rect x="200" y="440" width="52" height="26" rx="13" fill="#1a1a1a"/><text x="226" y="459" text-anchor="middle">GND</text>
    <rect x="238" y="500" width="52" height="26" rx="13" fill="#e53935"/><text x="264" y="519" text-anchor="middle">3V3</text>
    <rect x="278" y="560" width="52" height="26" rx="13" fill="#f9a825"/><text x="304" y="579" text-anchor="middle">SCL</text>
    <rect x="318" y="600" width="52" height="26" rx="13" fill="#43a047"/><text x="344" y="619" text-anchor="middle">SDA</text>
    <rect x="618" y="560" width="52" height="26" rx="13" fill="#1e88e5"/><text x="644" y="579" text-anchor="middle">CS</text>
    <rect x="658" y="600" width="52" height="26" rx="13" fill="#8e24aa"/><text x="684" y="619" text-anchor="middle">BL</text>
    <rect x="698" y="640" width="52" height="26" rx="13" fill="#fb8c00"/><text x="724" y="659" text-anchor="middle">RST</text>
    <rect x="738" y="680" width="52" height="26" rx="13" fill="#d81b60"/><text x="764" y="699" text-anchor="middle">DC</text>
  </g>

  <!-- ================= ESP32-C3 Super Mini ================= -->
  <g filter="url(#sh)">
    <rect x="380" y="180" width="200" height="430" rx="14" fill="#14171c"/>
  </g>
  <!-- USB-C -->
  <rect x="430" y="186" width="100" height="56" rx="10" fill="#c9ccd1"/>
  <rect x="442" y="198" width="76" height="32" rx="6" fill="#7c8087"/>
  <!-- antenna area -->
  <rect x="392" y="256" width="176" height="34" fill="#20242b"/>
  <text x="480" y="279" text-anchor="middle" font-size="15" fill="#8b9096" letter-spacing="3">▓▓ ANT ▓▓</text>
  <!-- chip -->
  <rect x="436" y="430" width="88" height="88" rx="8" fill="#262b33" stroke="#3a4048"/>
  <text x="480" y="470" text-anchor="middle" font-size="16" fill="#aab" font-weight="700">ESP32</text>
  <text x="480" y="492" text-anchor="middle" font-size="16" fill="#aab" font-weight="700">-C3</text>
  <!-- buttons -->
  <rect x="400" y="540" width="52" height="34" rx="6" fill="#2b313a" stroke="#454c56"/>
  <text x="426" y="562" text-anchor="middle" font-size="12" fill="#9aa">BOOT</text>
  <rect x="508" y="540" width="52" height="34" rx="6" fill="#2b313a" stroke="#454c56"/>
  <text x="534" y="562" text-anchor="middle" font-size="12" fill="#9aa">RST</text>
  <text x="480" y="640" text-anchor="middle" font-size="15" fill="#e8eaed" font-weight="700" transform="rotate(-90 480 640)"></text>
  <text x="480" y="305" text-anchor="middle" font-size="13" fill="#7d838c">ESP32-C3 Super Mini</text>

  <!-- left pads: 5V, G, 3V3, GPIO10, 9, GPIO8 -->
  <g font-size="14" font-weight="700">
    <circle cx="382" cy="220" r="9" fill="#d4a94e"/><text x="398" y="225" fill="#cfd3d8">5V</text>
    <circle cx="382" cy="270" r="9" fill="#d4a94e"/><text x="398" y="275" fill="#cfd3d8">G</text>
    <circle cx="382" cy="320" r="9" fill="#d4a94e"/><text x="398" y="325" fill="#cfd3d8">3V3</text>
    <circle cx="382" cy="370" r="9" fill="#d4a94e"/><text x="398" y="375" fill="#cfd3d8">10</text>
    <circle cx="382" cy="420" r="9" fill="#d4a94e"/><text x="398" y="425" fill="#cfd3d8">8</text>
    <circle cx="382" cy="470" r="9" fill="#d4a94e"/><text x="398" y="475" fill="#777d85">7</text>
    <circle cx="382" cy="520" r="9" fill="#d4a94e"/><text x="398" y="525" fill="#777d85">6</text>
  </g>
  <!-- right pads: GPIO5, GPIO4, GPIO3, GPIO2, GPIO1, GPIO0 -->
  <g font-size="14" font-weight="700">
    <circle cx="578" cy="270" r="9" fill="#d4a94e"/><text x="562" y="275" fill="#777d85" text-anchor="end">5</text>
    <circle cx="578" cy="320" r="9" fill="#d4a94e"/><text x="562" y="325" fill="#777d85" text-anchor="end">4…</text>
    <circle cx="578" cy="370" r="9" fill="#d4a94e"/><text x="562" y="375" fill="#cfd3d8" text-anchor="end">4</text>
    <circle cx="578" cy="420" r="9" fill="#d4a94e"/><text x="562" y="425" fill="#cfd3d8" text-anchor="end">3</text>
    <circle cx="578" cy="470" r="9" fill="#d4a94e"/><text x="562" y="475" fill="#cfd3d8" text-anchor="end">2</text>
    <circle cx="578" cy="520" r="9" fill="#d4a94e"/><text x="562" y="525" fill="#cfd3d8" text-anchor="end">1</text>
    <circle cx="578" cy="570" r="9" fill="#d4a94e"/><text x="562" y="575" fill="#777d85" text-anchor="end">0</text>
  </g>
  <text x="480" y="155" text-anchor="middle" font-size="24" font-weight="800" fill="#1a1a1a">ESP32-C3 Super Mini</text>
  <text x="480" y="660" text-anchor="middle" font-size="16" fill="#666">Type-C 供电 / 烧录（5V）</text>

  <!-- ================= ST7789 display ================= -->
  <text x="1240" y="155" text-anchor="middle" font-size="24" font-weight="800" fill="#1a1a1a">1.54" ST7789 TFT（240×240）</text>
  <g filter="url(#sh)">
    <rect x="1050" y="180" width="380" height="460" rx="14" fill="#14171c"/>
  </g>
  <!-- glass -->
  <rect x="1072" y="200" width="336" height="336" rx="6" fill="url(#scr)"/>
  <!-- eyes -->
  <rect x="1130" y="300" width="80" height="110" rx="40" fill="#14100c"/>
  <rect x="1270" y="300" width="80" height="110" rx="40" fill="#14100c"/>
  <circle cx="1150" cy="325" r="12" fill="#fff" opacity="0.9"/>
  <circle cx="1290" cy="325" r="12" fill="#fff" opacity="0.9"/>
  <text x="1240" y="490" text-anchor="middle" font-size="20" font-weight="700" fill="#14100c">Clawd Mochi</text>

  <!-- screen pins -->
  <g font-size="14" font-weight="700" fill="#cfd3d8">
    <circle cx="1090" cy="660" r="9" fill="#d4a94e"/><text x="1090" y="700" text-anchor="middle" fill="#555">GND</text>
    <circle cx="1130" cy="660" r="9" fill="#d4a94e"/><text x="1130" y="700" text-anchor="middle" fill="#555">VCC</text>
    <circle cx="1170" cy="660" r="9" fill="#d4a94e"/><text x="1170" y="700" text-anchor="middle" fill="#555">SCL</text>
    <circle cx="1210" cy="660" r="9" fill="#d4a94e"/><text x="1210" y="700" text-anchor="middle" fill="#555">SDA</text>
    <circle cx="1250" cy="660" r="9" fill="#d4a94e"/><text x="1250" y="700" text-anchor="middle" fill="#555">RES</text>
    <circle cx="1290" cy="660" r="9" fill="#d4a94e"/><text x="1290" y="700" text-anchor="middle" fill="#555">DC</text>
    <circle cx="1330" cy="660" r="9" fill="#d4a94e"/><text x="1330" y="700" text-anchor="middle" fill="#555">BLK</text>
    <circle cx="1370" cy="660" r="9" fill="#d4a94e"/><text x="1370" y="700" text-anchor="middle" fill="#555">CS</text>
  </g>

  <!-- ================= Connection table ================= -->
  <g>
    <rect x="120" y="840" width="1360" height="230" rx="16" fill="#fff" stroke="#e3e5e8"/>
    <text x="160" y="890" font-size="24" font-weight="800" fill="#1a1a1a">接线对照表</text>
    <g font-size="19" fill="#333">
      <text x="160" y="935" font-weight="700" fill="#888">屏幕引脚</text>
      <text x="430" y="935" font-weight="700" fill="#888">ESP32-C3 引脚</text>
      <text x="700" y="935" font-weight="700" fill="#888">作用</text>
      <text x="1080" y="935" font-weight="700" fill="#888">线色</text>
    </g>
    <g font-size="19" fill="#222">
      <text x="160" y="975">GND / VCC</text><text x="430" y="975">GND / 3V3</text><text x="700" y="975">供电（3.3V，不要接 5V 到 VCC）</text>
      <rect x="1080" y="958" width="26" height="18" rx="4" fill="#1a1a1a"/><rect x="1114" y="958" width="26" height="18" rx="4" fill="#e53935"/>
      <text x="160" y="1010">SCL / SDA</text><text x="430" y="1010">GPIO8 / GPIO10</text><text x="700" y="1010">SPI 时钟 / MOSI（40 MHz）</text>
      <rect x="1080" y="993" width="26" height="18" rx="4" fill="#f9a825"/><rect x="1114" y="993" width="26" height="18" rx="4" fill="#43a047"/>
      <text x="160" y="1045">RES / DC / CS / BLK</text><text x="430" y="1045">GPIO2 / 1 / 4 / 3</text><text x="700" y="1045">复位 / 数据命令 / 片选 / 背光 (PWM)</text>
      <rect x="1080" y="1028" width="26" height="18" rx="4" fill="#fb8c00"/><rect x="1114" y="1028" width="26" height="18" rx="4" fill="#d81b60"/><rect x="1148" y="1028" width="26" height="18" rx="4" fill="#1e88e5"/><rect x="1182" y="1028" width="26" height="18" rx="4" fill="#8e24aa"/>
    </g>
  </g>
</svg>
